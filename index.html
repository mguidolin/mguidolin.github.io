		<script>
			window.onload = function() { document.body.classList.remove('is-preload'); }
			window.ontouchmove = function() { return false; }
			window.onorientationchange = function() { document.body.scrollTop = 0; }

			var showingEmail = false;
			function toggleEmail() {
				var nameElement = document.getElementById('title');
				// Lock the height to prevent jumping
				if (!nameElement.style.height) {
					nameElement.style.height = nameElement.offsetHeight + 'px';
				}
				nameElement.style.transition = 'opacity 0.5s ease-in-out';
				nameElement.style.opacity = '0';

				setTimeout(function() {
					if (showingEmail) {
						nameElement.textContent = 'Mattia Guidolin';
						nameElement.style.fontSize = '';
						nameElement.style.display = '';
						nameElement.style.alignItems = '';
					} else {
						nameElement.textContent = 'mattia.guidolin [at] unipd.it';
						nameElement.style.fontSize = '3em';
						nameElement.style.display = 'flex';
						nameElement.style.alignItems = 'flex-end';
						nameElement.style.justifyContent = 'center';
					}
					showingEmail = !showingEmail;
					nameElement.style.opacity = '1';
				}, 500);
			}
		</script>
